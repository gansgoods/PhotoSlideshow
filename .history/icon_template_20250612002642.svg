<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 相框渐变 -->
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 照片渐变 -->
    <linearGradient id="photoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeaa7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fab1a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#backgroundGradient)"/>
  
  <!-- 第一张照片（后面的） -->
  <rect x="200" y="180" width="500" height="380" rx="25" ry="25" fill="url(#frameGradient)" filter="url(#dropshadow)" transform="rotate(-8 450 370)"/>
  <rect x="225" y="205" width="450" height="330" rx="15" ry="15" fill="url(#photoGradient)" transform="rotate(-8 450 370)"/>
  
  <!-- 第二张照片（中间的） -->
  <rect x="250" y="220" width="500" height="380" rx="25" ry="25" fill="url(#frameGradient)" filter="url(#dropshadow)" transform="rotate(-3 500 410)"/>
  <rect x="275" y="245" width="450" height="330" rx="15" ry="15" fill="#a8e6cf" transform="rotate(-3 500 410)"/>
  
  <!-- 第三张照片（最前面的） -->
  <rect x="300" y="260" width="500" height="380" rx="25" ry="25" fill="url(#frameGradient)" filter="url(#dropshadow)" transform="rotate(5 550 450)"/>
  <rect x="325" y="285" width="450" height="330" rx="15" ry="15" fill="#ffd93d" transform="rotate(5 550 450)"/>
  
  <!-- 播放按钮图标 -->
  <circle cx="550" cy="450" r="80" fill="#ffffff" fill-opacity="0.9" filter="url(#dropshadow)"/>
  <polygon points="520,420 520,480 590,450" fill="#667eea" transform="rotate(5 550 450)"/>
  
  <!-- 闪光效果 -->
  <circle cx="300" cy="250" r="20" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="310" cy="240" r="8" fill="#ffffff" fill-opacity="0.8"/>
  
  <!-- 底部标题装饰 -->
  <rect x="200" y="750" width="624" height="120" rx="60" ry="60" fill="#ffffff" fill-opacity="0.15"/>
  <text x="512" y="825" font-family="system-ui, -apple-system" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffffff">PhotoSlideshow</text>
</svg> 